[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ugc-video-agent"
version = "0.1.0"
description = "A skill-driven UGC video agent built on LangChain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "pydantic>=2.10.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ugc_agent = ["skills/**/*.md", "web/**"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
